<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Switzer,system-ui,sans-serif;color:#0a0a0a;position:relative;
    background:
      radial-gradient(60% 80% at 15% 20%, #e9fb9f 0%, transparent 60%),
      radial-gradient(55% 75% at 85% 15%, #d9cffd 0%, transparent 62%),
      radial-gradient(70% 80% at 70% 100%, #bfe3ff 0%, transparent 60%),
      radial-gradient(50% 60% at 10% 100%, #ffe1c7 0%, transparent 60%),
      #fbfbf7;}
  .grain{position:absolute;inset:0;opacity:.18;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.35'/></svg>")}
  .brand{position:absolute;top:56px;left:72px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);padding:12px 20px 12px 16px;border-radius:14px}
  .brand img{height:44px}
  .brand .sep{width:1.5px;height:30px;background:rgba(10,10,10,.2)}
  .brand .shop{font-size:24px;letter-spacing:.16em;color:rgba(10,10,10,.8)}
  .brand .beta{font-size:13px;font-weight:600;letter-spacing:.08em;background:#d4f01f;color:#0b3d1c;border-radius:99px;padding:4px 10px}
  h1{position:absolute;left:72px;top:164px;margin:0;font-size:80px;line-height:.98;font-weight:500;letter-spacing:-.045em;width:960px}
  .chat{position:absolute;left:72px;bottom:120px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:14px 14px 14px 28px;width:640px;box-shadow:0 18px 50px -20px rgba(11,61,28,.35);font-size:24px;color:#8a8a8a}
  .chat .go{margin-left:auto;width:48px;height:48px;border-radius:99px;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-size:24px}
  .brands{position:absolute;left:72px;right:72px;bottom:52px;font-size:22px;letter-spacing:-.01em;color:rgba(10,10,10,.55);white-space:nowrap;overflow:hidden}
  .brands b{color:#0a0a0a;font-weight:500}
</style></head><body><div class="grain"></div>
<div class="brand"><img src="../public/deco-logo.png"><span class="sep"></span><span class="shop">shop</span><span class="beta">BETA</span></div>
<h1>Todas as marcas brasileiras que você ama. Um chat.</h1>
<div class="chat">vestido de linho para um casamento de dia<span class="go">→</span></div>
<div class="brands"><b>FARM Rio · Animale · Lenny Niemeyer · Osklen · Dress To · Reserva · Aviator</b> &nbsp;e mais de 50 marcas</div>
</body></html>
